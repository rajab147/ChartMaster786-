name: cvd-zero-cross
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      NTFY_URL: ${{ secrets.NTFY_URL }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install aiohttp websockets python-dotenv
      - name: Run bot
        run: timeout -s INT -k 120 340m python cvd_zero_cross.py; code=$?; if [ $code -eq 0 ] || [ $code -eq 124 ] || [ $code -eq 137 ]; then echo "OK exit=$code"; else echo "FAIL exit=$code"; exit 1; fi
